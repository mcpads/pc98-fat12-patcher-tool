[package]
name = "pc98-fat12-patcher-core"
version = "0.0.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
anyhow = "1.0"
delharc = { version = "0.8", default-features = false, features = ["std"] }
fatfs = { version = "0.3.6", default-features = false, features = ["std"] }
retro-patch-utility = { git = "https://github.com/mcpads/retro-patch-utility", rev = "1733ff660268da277cde808d42f02540b997c6b2" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11"
zip = { version = "8.6.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tempfile = "3.27"
